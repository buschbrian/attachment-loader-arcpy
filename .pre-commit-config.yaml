# Pre-commit hooks. Install once per clone:
#
#     pre-commit install
#
# Hooks run against STAGED CONTENT ONLY, so pre-existing issues elsewhere in
# the tree never block an unrelated commit. To audit everything:
#
#     pre-commit run --all-files
#
# Why this exists: git history is permanent. A key that reaches a remote is
# compromised even if the next commit deletes it, and under GRAMA anything
# committed to a city repo can become a public record. This is the last gate
# before that.

repos:
  # --- secrets -------------------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key

      # --- irreversible / expensive mistakes ------------------------------
      - id: check-added-large-files
        args: [--maxkb=5120]
      - id: check-merge-conflict
      - id: check-case-conflict
